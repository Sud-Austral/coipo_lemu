name: Forge Lab Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: forge-${{ github.repository }}-lab
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, forge]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest
        run: python3 -m json.tool forge.json >/dev/null

      - name: Build image
        run: sudo docker build -t forge-per-lemu2-0:latest .

      - name: Load Forge token
        run: |
          FORGE_TOKEN="$(sudo /usr/bin/sed -n 's/^FORGE_DEPLOY_TOKEN=//p' /etc/forestin/forge.env)"
          test -n "$FORGE_TOKEN"
          echo "::add-mask::$FORGE_TOKEN"
          echo "FORGE_TOKEN=$FORGE_TOKEN" >> "$GITHUB_ENV"

      - name: Register and deploy in Forge Lab
        run: |
          python3 - <<'PY' > /tmp/forge-payload.json
          import json, os
          m = json.load(open('forge.json', encoding='utf-8'))
          print(json.dumps({
            'repository': os.environ['GITHUB_REPOSITORY'],
            'name': m['name'], 'slug': m['slug'], 'environment': 'lab',
            'branch': os.environ['GITHUB_REF_NAME'], 'commit': os.environ['GITHUB_SHA'],
            'status': 'online', 'url': f"/lab/{m['slug']}/",
            'description': m.get('description', ''), 'version': m.get('version', ''),
            'required_secrets': m.get('required_secrets', []),
            'secret_bindings': m.get('secret_bindings', []),
            'services': m.get('services', [])
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $FORGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/forge-payload.json \
            http://127.0.0.1:8310/api/deploy \
            | tee /tmp/lemu-forge-deploy.json

      - name: Detect pending secrets
        id: secrets
        run: |
          PENDING="$(python3 - <<'PY'
          import json
          d = json.load(open('/tmp/lemu-forge-deploy.json'))
          missing = d.get('project', {}).get('missing_secrets') or []
          print('true' if missing else 'false')
          PY
          )"
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          if [ "$PENDING" = "true" ]; then
            echo "::warning::Faltan secretos por cargar en Forge Admin (GEE_API_KEY/SIGCRA_API_KEY/SAFF_API_KEY se autocompletan por secret_bindings; si no hay servicios upstream aun, revisar manualmente). Esta version no sirve hasta que se resuelvan."
          fi

      - name: Resolve deployed port
        if: steps.secrets.outputs.pending != 'true'
        run: |
          PORT="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/lemu-forge-deploy.json'))
          services=d.get('project',{}).get('services',[])
          print(services[0].get('port','') if services else '')
          PY
          )"
          test -n "$PORT" || { echo 'Forge did not assign a port to Lemu 2.0'; cat /tmp/lemu-forge-deploy.json; exit 1; }
          echo "LEMU_PORT=$PORT" >> "$GITHUB_ENV"
          echo "Forge assigned Lemu 2.0 port $PORT"

      - name: Verify Forge-managed container
        if: steps.secrets.outputs.pending != 'true'
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $FORGE_TOKEN" \
            http://127.0.0.1:8310/api/docker \
            | tee /tmp/forge-docker.json >/dev/null
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/forge-docker.json'))
          rows=d.get('containers',[])
          target=next((x for x in rows if x.get('Names')=='forge-lab-lemu2-0-web'),None)
          assert target, 'forge-lab-lemu2-0-web is not managed/running in Forge'
          print(target.get('Names'), target.get('Status'), target.get('Ports'))
          PY

      - name: Verify health and readiness
        if: steps.secrets.outputs.pending != 'true'
        run: |
          for i in $(seq 1 20); do
            if curl --fail --silent --max-time 3 "http://127.0.0.1:${LEMU_PORT}/health" >/tmp/lemu-health.json; then break; fi
            sleep 1
          done
          cat /tmp/lemu-health.json
          curl --silent --show-error --max-time 10 "http://127.0.0.1:${LEMU_PORT}/ready" | tee /tmp/lemu-ready.json || true

      - name: Smoke test deteccion piloto (Panguipulli)
        if: steps.secrets.outputs.pending != 'true'
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            "http://127.0.0.1:${LEMU_PORT}/api/v1/deteccion?region=panguipulli&t0=2026-07-01&t1=2026-09-01" \
            | tee /tmp/lemu-deteccion.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/lemu-deteccion.json'))
          print('Lemu 2.0 smoke:', 'puntos=', d.get('puntos_evaluados'), 'alertas=', d.get('alertas'))
          PY

      - name: Smoke test ficha del punto (SAFF + SIGCRA)
        if: steps.secrets.outputs.pending != 'true'
        run: |
          # Falla solo en HTTP 5xx; 0 planes es un resultado valido. Imprime solo conteos.
          CODE="$(curl --silent --show-error --max-time 600 -o /tmp/lemu-ficha.json -w '%{http_code}' \
            "http://127.0.0.1:${LEMU_PORT}/api/v1/punto/ficha?region=panguipulli&lat=-39.715&lon=-72.145")"
          echo "ficha HTTP $CODE"
          if [ "$CODE" -ge 500 ]; then echo "::error::/api/v1/punto/ficha devolvio HTTP $CODE"; exit 1; fi
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/lemu-ficha.json'))
          saff = d.get('saff') or {}
          print('Lemu 2.0 ficha:', 'saff=', saff.get('estado'), 'planes_comuna=', saff.get('planes_comuna'),
                'planes_cercanos=', len(d.get('planes') or []), 'rodales=', len((d.get('rodales') or {}).get('features') or []),
                'sigcra=', (d.get('sigcra') or {}).get('estado'))
          PY

      - name: Refresh managed Nginx routes
        if: steps.secrets.outputs.pending != 'true'
        run: sudo /usr/local/sbin/forge-nginx-route

      - name: Verify Nginx Lemu 2.0 health route
        if: steps.secrets.outputs.pending != 'true'
        run: |
          curl --fail-with-body --silent --show-error --max-time 10 \
            -H 'Host: dev-prueba1.conaf.cl' \
            http://127.0.0.1/lab/lemu2-0/health

      - name: Verify Forge control plane
        run: curl --fail --silent --show-error http://127.0.0.1:8310/api/health
